<!doctype html>
<html lang="zh-CN">
<head>

  <link rel="canonical" href="https://windysi.com/">
  <style>
    :root { --ink: #182326; --muted: #526064; --line: #dfe5e2; --accent: #286557; --soft: #eaf5ed; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; min-height: 100svh;
      display: grid; place-items: center; padding: 32px 20px;
      background: #f5f6f2; color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      line-height: 1.6; -webkit-font-smoothing: antialiased;
    }
    main {
      width: min(100%, 760px); overflow: hidden;
      background: #fff; border: 1px solid var(--line); border-radius: 26px;
      box-shadow: 0 22px 70px rgba(24, 35, 38, .05);
    }
    .hero { padding: clamp(28px, 6vw, 60px); background: linear-gradient(140deg, var(--soft), #fff 75%); }
    .badge {
      display: inline-flex; flex-wrap: wrap; align-items: center; gap: 9px; margin: 0 0 32px;
      color: var(--accent); font-size: 12px; font-weight: 700; letter-spacing: .08em;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
    h1 { margin: 0 0 24px; font-size: clamp(34px, 7vw, 68px); font-weight: 650; line-height: 1.15; letter-spacing: -.055em; overflow-wrap: anywhere; }
    .cn { margin: 0; font-size: clamp(18px, 3.5vw, 22px); font-weight: 500; line-height: 1.8; }
    .en { margin: 12px 0 0; max-width: 42ch; color: var(--muted); font-size: 16px; line-height: 1.7; }
    .contacts { padding: 0 clamp(28px, 6vw, 60px) 36px; }
    h2 { margin: 0 0 16px; color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: .09em; }
    dl { margin: 0; border-top: 1px solid var(--line); }
    .contact { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 12px; padding: 20px 0; align-items: baseline; border-bottom: 1px solid var(--line); }
    dt { color: var(--muted); font-size: 14px; }
    dd { margin: 0; font-size: 18px; font-weight: 500; overflow-wrap: anywhere; }
    a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 5px; }
    a:hover { text-decoration-thickness: 2px; }
    a:focus-visible { outline: 3px solid var(--accent); outline-offset: 5px; border-radius: 2px; }
    .note { margin: 20px 0 0; color: var(--muted); font-size: 12px; }
    @media (max-width: 480px) {
      body { padding: 20px 14px; }
      main { border-radius: 20px; }
      .badge { margin-bottom: 24px; letter-spacing: .04em; }
      .contact { grid-template-columns: 1fr; gap: 4px; padding: 16px 0; }
      dd { font-size: 17px; }
    }
  </style>
</head>
<body>

      <p class="badge"><span class="dot" aria-hidden="true"></span><span>域名出售</span><span aria-hidden="true">/</span><span lang="en">DOMAIN FOR SALE</span></p>
      <h1 id="domain" lang="en">windysi.com</h1>

    </section>
    <section class="contacts" aria-labelledby="contact-heading">
      <h2 id="contact-heading">联系 / <span lang="en">CONTACT</span></h2>
      <dl>
        <div class="contact">
          <dt>邮箱 / <span lang="en">Email</span></dt>
          <dd><a href="mailto:astrum43z@gmail.com">astrum43z@gmail.com</a></dd>

        <div class="contact">
          <dt>微信 / <span lang="en">WeChat</span></dt>

        </div>
      </dl>
      <p class="note">购买咨询请发送邮件 · <span lang="en">Email for purchase inquiries</span></p>
    </section>
  </main>
</body>
</html>
